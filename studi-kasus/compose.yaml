# Lab infrastructure. Services run on the host (go run) and connect to these
# containers through the published ports (15432+, away from a locally installed
# PostgreSQL on 5432). One PostgreSQL container per service:
# database-per-service. Kafka from Lab 5, Hydra (OAuth2 server) from Lab 7,
# otel-lgtm (observability) from Lab 8.
services:
  db-account:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: account
      POSTGRES_USER: account
      POSTGRES_PASSWORD: account123
    ports:
      - "15432:5432"
    volumes:
      - db-account:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "account", "-d", "account"]
      interval: 2s
      retries: 30

  db-transfer:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: transfer
      POSTGRES_USER: transfer
      POSTGRES_PASSWORD: transfer123
    ports:
      - "15433:5432"
    volumes:
      - db-transfer:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "transfer", "-d", "transfer"]
      interval: 2s
      retries: 30

  db-notification:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification123
    ports:
      - "15434:5432"
    volumes:
      - db-notification:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notification", "-d", "notification"]
      interval: 2s
      retries: 30

  # Single-node Kafka in KRaft mode: the same process is broker and controller,
  # no ZooKeeper. Two client listeners:
  #   HOST     localhost:9092 for the services running on the laptop
  #   INTERNAL kafka:29092 for containers on the compose network (kafka-init)
  # A client connects to the bootstrap address, then reconnects to the address
  # the broker advertises for its listener; that is why each audience needs its
  # own listener.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # One broker: internal topics cannot have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # A new consumer gets its partitions at once instead of after 3 s.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created on purpose (kafka-init), never by a typo in a client.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 30

  # One-shot: creates the topic and exits. 3 partitions = up to 3 consumers of
  # one group work in parallel; events with the same key (transfer ID) always
  # land in the same partition, so they stay in order.
  # Profile "init" keeps it out of "up --wait", which waits for running
  # containers and does not expect one that exits; make infra-up runs it with
  # "docker compose run" after Kafka is healthy.
  kafka-init:
    image: apache/kafka:4.3.1
    profiles: ["init"]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists",
              "--topic", "transfer-events", "--partitions", "3", "--replication-factor", "1"]

  # OAuth2 authorization server (Lab 7), provided ready to use: the lab is about
  # the resource servers (account, transfer), not about configuring Hydra.
  #   public 4444  token endpoint /oauth2/token, keys /.well-known/jwks.json
  #   admin  4445  client management (hydra-init); never exposed in production
  # --dev allows plain HTTP. DSN=memory keeps everything in RAM: clients and
  # signing keys are gone after a restart; make infra-up recreates the clients,
  # and the services fetch the new keys when they see an unknown key ID.
  hydra:
    image: oryd/hydra:v26.2.0
    command: ["serve", "all", "--dev"]
    environment:
      DSN: memory
      # The "iss" claim of every token. The services check it (OAUTH_ISSUER).
      URLS_SELF_ISSUER: http://localhost:4444/
      # JWT instead of opaque tokens: a service verifies the signature with the
      # public keys from JWKS, without calling Hydra for every request.
      STRATEGIES_ACCESS_TOKEN: jwt
      # Lab value only; production keeps it in a secret store.
      SECRETS_SYSTEM: lab-only-system-secret-change-me
    ports:
      - "4444:4444"
      - "4445:4445"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4444/health/ready"]
      interval: 2s
      retries: 30

  # One-shot: registers the two OAuth2 clients with fixed IDs and secrets, so
  # the Makefiles can carry them. Delete first: a second infra-up on a running
  # Hydra would otherwise fail with "client already exists".
  #   transfer-service  the transfer service calling account over gRPC
  #   channel-app       the channel (mobile/web backend) calling transfer REST
  # Scopes are what a client MAY request; the token carries what it did request.
  hydra-init:
    image: oryd/hydra:v26.2.0
    profiles: ["init"]
    depends_on:
      hydra:
        condition: service_healthy
    environment:
      ORY_SDK_URL: http://hydra:4445
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        hydra delete oauth2-client transfer-service channel-app >/dev/null 2>&1 || true
        hydra create oauth2-client --id transfer-service --secret transfer-service-secret \
          --grant-type client_credentials --response-type token \
          --scope account:read,account:write --access-token-strategy jwt --quiet
        hydra create oauth2-client --id channel-app --secret channel-app-secret \
          --grant-type client_credentials --response-type token \
          --scope transfer:read,transfer:write --access-token-strategy jwt --quiet

  # Observability backend in one container (Lab 8), for development and labs
  # only: OpenTelemetry Collector, Prometheus (metrics), Tempo (traces), Loki
  # (logs) and Grafana. Production runs each of them separately, with storage.
  #   3000  Grafana, no login (anonymous admin)
  #   4317  OTLP gRPC: the services send traces and logs here
  #   4318  OTLP HTTP, for clients without gRPC
  # Metrics go the other way: Prometheus inside the container scrapes /metrics
  # of the services on the laptop (observability/prometheus.yaml). No volume:
  # the data is gone when the container is recreated.
  otel-lgtm:
    image: grafana/otel-lgtm:0.37.0
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    # host.docker.internal = the laptop. Docker Desktop has it built in; on a
    # Linux Docker Engine this line creates it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/studi-kasus.yaml:ro
      - ./observability/dashboards:/otel-lgtm/dashboards/studi-kasus:ro
    # The image checks every 30 s; up --wait would sit idle that long.
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  db-account:
  db-transfer:
  db-notification:
  kafka:
