# Credentials (DATABASE_URL and OAUTH_CLIENT_SECRET), passed as environment variables like the
# ConfigMap. Empty here: every environment has its own, so the overlay fills
# it. A Secret is only base64 in etcd, not encrypted, unless the cluster
# enables encryption at rest; RBAC decides who may read it.
apiVersion: v1
kind: Secret
metadata:
  name: transfer
type: Opaque
