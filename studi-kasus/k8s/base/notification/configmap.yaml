# Non-secret configuration, passed to the container as environment variables
# (envFrom in deployment.yaml). Only keys that are the same in every
# environment live here; the overlay adds the rest. Environment variables are
# read once at startup: after changing a ConfigMap, restart the pods
# (kubectl rollout restart deployment/notification).
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification
data:
  HTTP_ADDR: ":8083"
  OTEL_SERVICE_NAME: notification
