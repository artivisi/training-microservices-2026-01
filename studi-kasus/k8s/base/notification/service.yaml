# Stable name and virtual IP in front of the ready notification pods: notification:8083
# inside the namespace.
apiVersion: v1
kind: Service
metadata:
  name: notification
  labels:
    app.kubernetes.io/name: notification
spec:
  selector:
    app.kubernetes.io/name: notification
  ports:
    - name: http
      port: 8083
      targetPort: http
