# Lab credentials, the same as in compose.yaml and the service Makefiles.
# Committed here only because they protect nothing outside the laptop. A real
# environment never keeps Secrets in the repository: they come from a vault
# or a secret operator (External Secrets, Sealed Secrets), or are created by
# the pipeline from its credential store.
# stringData takes plain text; the API server stores it base64-encoded under
# data. Because of that conversion, removing a key here and applying again
# does not remove it from the live Secret: delete the Secret and apply.
apiVersion: v1
kind: Secret
metadata:
  name: account
stringData:
  DATABASE_URL: postgres://account:account123@host.k3d.internal:15432/account
---
apiVersion: v1
kind: Secret
metadata:
  name: transfer
stringData:
  DATABASE_URL: postgres://transfer:transfer123@host.k3d.internal:15433/transfer
  OAUTH_CLIENT_SECRET: transfer-service-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: notification
stringData:
  DATABASE_URL: postgres://notification:notification123@host.k3d.internal:15434/notification
