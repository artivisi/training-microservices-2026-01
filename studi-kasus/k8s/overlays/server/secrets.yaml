# No credentials in the repository for a shared server: the instructor
# creates the Secrets account, transfer and notification in the namespace
# (DATABASE_URL of the participant's own databases, OAUTH_CLIENT_SECRET of
# transfer). These patches remove the empty Secrets of the base from the
# output, so kubectl apply never touches the ones that exist.
# Without them a pod stops at startup with "missing required environment
# variables: DATABASE_URL ..." (envFrom of a missing Secret fails earlier,
# with CreateContainerConfigError).
apiVersion: v1
kind: Secret
metadata:
  name: account
$patch: delete
---
apiVersion: v1
kind: Secret
metadata:
  name: transfer
$patch: delete
---
apiVersion: v1
kind: Secret
metadata:
  name: notification
$patch: delete
